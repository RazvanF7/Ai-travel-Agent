name: Playwright E2E Tests

on:
  push:
    branches: [ "main", "rebase" ]
  pull_request:
    branches: [ "main", "rebase" ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # 1. Spin up an ephemeral, throwaway PostgreSQL container purely for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: travel_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. Tell Django to connect to the throwaway container, overriding your .env
    env:
      DB_NAME: travel_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-secret-key-placeholder-for-playwright-e2e-testing
      DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Migrations (creates tables in the throwaway DB)
        run: |
          python backend/manage.py migrate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 3. Start the Django application so Playwright can navigate to it
      - name: Start Django Server
        run: |
          python backend/manage.py runserver 0.0.0.0:8000 &
          sleep 5  # Give the server a few seconds to boot up before testing

      # 4. Run the automated browser tests
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30